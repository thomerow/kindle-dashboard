# nginx: location of the Kindle dashboard inside the server block on port 443. deploy.sh replaces @PATHBASE@ and @PORT@.
# Author: Thorsten Kummerow <thorsten.kummerow (at) gmail (dot) com>
# No trailing slash and with ^~ (a POST to the path without slash must not be redirected),
# proxy_pass without a URI part (the application strips the prefix itself with UsePathBase).
location ^~ @PATHBASE@ {
    proxy_pass http://127.0.0.1:@PORT@;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 70s;             # longer than the long poll of the Kindle on the charger (50 s)
    proxy_buffering off;
    client_max_body_size 16k;
}
